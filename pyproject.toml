[project]
name = "internal-ai-process-assistant"
version = "0.1.0"
description = "Internal AI assistant for document and data processing workflows."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "defusedxml>=0.7.1",
    "openpyxl==3.1.5",
    "pypdf==6.14.2",
    "reportlab==4.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
